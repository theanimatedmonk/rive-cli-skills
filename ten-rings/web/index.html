<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Ten Rings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero">
      <canvas id="rings" class="hero__canvas" aria-label="The ten rings"></canvas>

      <div class="controls">
        <div class="toggle" role="group" aria-label="Wielder" id="wielders"></div>
        <div class="actions" role="group" aria-label="Ring actions">
          <button type="button" class="action" id="summon">Awaken</button>
          <button type="button" class="action" id="unleash" disabled>Unleash</button>
          <button type="button" class="action" id="recall" disabled>Recall</button>
          <!-- Temporary, for a video shot: all ten rings stacked on a forearm. -->
          <button type="button" class="action" id="stack" disabled>Stack</button>
        </div>
        <button type="button" class="action gesture-toggle" id="gesture-toggle" aria-pressed="false">
          Gestures
        </button>
      </div>
      <aside class="gesture-preview" id="gesture-preview" hidden>
        <video id="gesture-video" class="gesture-preview__video" playsinline muted autoplay></video>
        <p class="gesture-preview__hint" id="gesture-label"></p>
        <ul class="gesture-preview__legend">
          <li><span>Both fists at camera</span> Awaken · in orbit: back to the arms</li>
          <li><span>Open palm</span> Recall</li>
          <li><span>Pray</span> Summon</li>
          <li><span>Close fist</span> Unleash</li>
          <li><span>Move your hand</span> Rings follow (orbit)</li>
        </ul>
      </aside>
    </main>

    <script src="https://unpkg.com/@rive-app/webgl2@2.44.0"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
