<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device Stage: a screen of your own</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #f5f5f7; font-family: -apple-system, system-ui, sans-serif; }
      device-stage { height: 100vh; }
      /* Your UI: sized to the phone's viewport (100%), clear of the island. */
      .app { height: 100%; box-sizing: border-box; padding: var(--ds-safe-top) 20px var(--ds-safe-bottom);
        background: linear-gradient(180deg, #fff6ec, #ffe3cf); color: #2b1a10; display: flex; flex-direction: column; gap: 14px; }
      .app h1 { margin: 8px 0 0; font-size: 34px; letter-spacing: -0.02em; }
      .app button { font: 600 17px system-ui; padding: 16px; border: 0; border-radius: 16px; background: #ff6b2c; color: #fff; }
      .app .count { font-size: 72px; font-weight: 800; text-align: center; margin: auto 0; }
      .app ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      .app li { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 6px 18px rgba(120, 60, 20, 0.1); }
    </style>
  </head>
  <body>
    <!-- Your UI, as children: it runs live on the phone's screen. -->
    <device-stage device="iphone17pro" finish="Deep Blue" shot="float" backdrop="Studio">
      <div class="app">
        <h1>Good morning</h1>
        <ul>
          <li>Water the basil</li>
          <li>Call the studio</li>
        </ul>
        <div class="count" id="count">0</div>
        <button type="button" id="tap">Tap me</button>
      </div>
    </device-stage>

    <script type="module">
      import { defineDeviceStage } from "../src/index.js";
      defineDeviceStage();
      let n = 0;
      document.getElementById("tap").addEventListener("click", () => {
        document.getElementById("count").textContent = String(++n);
      });
    </script>
  </body>
</html>
