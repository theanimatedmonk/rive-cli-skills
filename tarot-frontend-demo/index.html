<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Divination</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <div class="frame-switch" role="group" aria-label="Device frame">
      <button type="button" data-frame="android" aria-pressed="true">Android</button>
      <button type="button" data-frame="iphone" aria-pressed="false">iPhone</button>
    </div>

    <div class="device" id="device">
      <span class="device__camera" aria-hidden="true"></span>
      <span class="device__island" aria-hidden="true"></span>
      <span class="device__key device__key--action" aria-hidden="true"></span>
      <span class="device__key device__key--vol-up" aria-hidden="true"></span>
      <span class="device__key device__key--vol-down" aria-hidden="true"></span>
      <span class="device__key device__key--power" aria-hidden="true"></span>
      <span class="device__key device__key--camera" aria-hidden="true"></span>
    <main class="phone">
      <canvas id="rive-canvas" class="phone__rive"></canvas>

      <div class="status-bar">
        <span class="status-bar__time">12:30</span>
        <span class="status-bar__icons status-bar__icons--android" aria-hidden="true">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 12 0 3.2A11.6 11.6 0 0 1 16 3.2Z" fill="currentColor" /></svg>
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M12 0v12H0Z" fill="currentColor" /></svg>
          <svg width="8" height="13" viewBox="0 0 8 13"><path d="M2.5 0h3v1.5H8V13H0V1.5h2.5Z" fill="currentColor" /></svg>
        </span>
        <span class="status-bar__icons status-bar__icons--ios" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" /><rect x="5" y="5.5" width="3" height="6.5" rx="1" /><rect x="10" y="3" width="3" height="9" rx="1" /><rect x="15" y="0" width="3" height="12" rx="1" /></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.4 0 4.6.9 6.2 2.5l1.3-1.4A10.6 10.6 0 0 0 8 .6 10.6 10.6 0 0 0 .5 3.7l1.3 1.4A8.7 8.7 0 0 1 8 2.6Zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.3-1.4A7.2 7.2 0 0 0 8 4.2c-1.9 0-3.7.7-5 2l1.3 1.4c1-.9 2.3-1.4 3.7-1.4Zm0 3.6c-.6 0-1.1.2-1.5.6L8 12l1.5-1.6c-.4-.4-.9-.6-1.5-.6Z" /></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity="0.4" /><rect x="2" y="2" width="19" height="9" rx="2" /><path d="M24 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill-opacity="0.4" /></svg>
        </span>
      </div>

      <header class="app-bar">
        <button type="button" class="app-bar__back" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M17 10H4m5-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <span class="app-bar__title">Daily Divination</span>
      </header>

      <section class="intro">
        <h1 class="intro__title" id="title">Choose a card</h1>
        <div class="intro__divider" aria-hidden="true">
          <span class="intro__line"></span>
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 0 7.4 4.6 12 6 7.4 7.4 6 12 4.6 7.4 0 6 4.6 4.6Z" fill="#E8C547" /></svg>
          <span class="intro__line"></span>
        </div>
        <p class="intro__subtitle" id="subtitle">Go with your first instinct. <br>
          Your message may already be waiting.</p>
      </section>

      <section class="result is-hidden" id="result" aria-live="polite">
        <p class="result__copy" id="result-copy">Click the button below to view your divination results today</p>
        <button type="button" class="result__cta" id="start-interpreting">Reveal my reading</button>
      </section>

      <!-- Final reading: plain HTML, no Rive. Three topic cards above a
           fixed reading box: the box's heading stays put while the
           paragraphs scroll, and scrolling into a topic's paragraph switches
           the heading and lights its card (main.js, syncReading). -->
      <section class="reading" id="reading" hidden>
        <header class="reading__top">
          <button type="button" class="reading__share" id="share">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4" /></svg>
            Share
          </button>
          <button type="button" class="reading__close" id="reading-close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>

        <div class="reading__head">
          <img class="reading__thumb" id="reading-card" alt="" />
          <div>
            <p class="reading__eyebrow" id="reading-eyebrow"></p>
            <h1 class="reading__name" id="reading-name"></h1>
          </div>
        </div>

        <div class="reading__cards">
          <button type="button" class="topic-card topic-card--love" data-topic="love" aria-label="Read about Love">
            <span class="topic-card__inner">
              <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
              <span class="topic-card__label">Love</span>
            </span>
          </button>
          <button type="button" class="topic-card topic-card--career" data-topic="career" aria-label="Read about Career">
            <span class="topic-card__inner">
              <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18" /></svg>
              <span class="topic-card__label">Career</span>
            </span>
          </button>
          <button type="button" class="topic-card topic-card--finance" data-topic="finance" aria-label="Read about Money">
            <span class="topic-card__inner">
              <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5l-1.4 3h-2.2zM9 7h6c2.7 2 5 5.2 5 8.6 0 3-2.4 5.4-8 5.4s-8-2.4-8-5.4C4 12.2 6.3 9 9 7z" /><path d="M13.7 11.6c-.3-.6-1-1-1.8-1-1 0-1.7.5-1.7 1.3s.7 1.1 1.7 1.3 1.8.6 1.8 1.4-.8 1.4-1.8 1.4c-.8 0-1.5-.4-1.8-1M12 9.6v7.4" /></svg>
              <span class="topic-card__label">Money</span>
            </span>
          </button>
        </div>

        <article class="reading__box" id="reading-box">
          <h2 class="reading__heading" id="reading-heading" aria-live="polite">
            <svg class="reading__icon" data-topic="love" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
            <svg class="reading__icon" data-topic="career" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18" /></svg>
            <svg class="reading__icon" data-topic="finance" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9.5 3h5l-1.4 3h-2.2zM9 7h6c2.7 2 5 5.2 5 8.6 0 3-2.4 5.4-8 5.4s-8-2.4-8-5.4C4 12.2 6.3 9 9 7z" /><path d="M13.7 11.6c-.3-.6-1-1-1.8-1-1 0-1.7.5-1.7 1.3s.7 1.1 1.7 1.3 1.8.6 1.8 1.4-.8 1.4-1.8 1.4c-.8 0-1.5-.4-1.8-1M12 9.6v7.4" /></svg>
            <span id="reading-heading-text"></span>
          </h2>
          <div class="reading__scroll" id="reading-scroll">
            <section class="reading__section" data-topic="love" aria-label="Love">
              <p id="reading-love"></p>
            </section>
            <section class="reading__section" data-topic="career" aria-label="Career">
              <p id="reading-career"></p>
            </section>
            <section class="reading__section" data-topic="finance" aria-label="Money">
              <p id="reading-finance"></p>
            </section>
          </div>
        </article>

        <p class="reading__toast" id="reading-toast" role="status" hidden></p>
      </section>


      <span class="home-indicator" aria-hidden="true"></span>
      <nav class="nav-bar" aria-hidden="true">
        <svg width="18" height="16" viewBox="0 0 18 16"><path d="M3 1v14M9 1v14M15 1v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="2" width="14" height="14" rx="5" fill="none" stroke="currentColor" stroke-width="2" /></svg>
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M11.5 2 5 9l6.5 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </nav>

      <!-- Home: a static screenshot for now. Tapping anywhere opens the
           card picker. -->
      <button type="button" class="home" id="home-screen" aria-label="Open Daily Divination">
        <img src="assets/home.png" alt="" />
        <span class="home__ios-top" aria-hidden="true"></span>
        <span class="home__ios-bottom" aria-hidden="true"></span>
        <span class="home__promo" id="home-promo">
          <span class="promo-star" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z" /></svg></span>
          <span class="promo-star promo-star--second" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z" /></svg></span>
          <img class="home__promo-card" id="promo-card" src="assets/promo-card.png" alt="" />
          <span class="home__promo-body">
            <span class="home__promo-title">Daily Divination</span>
            <span class="home__promo-copy" id="promo-copy">What does today have in store for you? Pick a card to find out.</span>
            <span class="home__promo-cta" id="promo-cta">Draw Card</span>
          </span>
        </span>
      </button>
    </main>
    </div>

    <script src="https://unpkg.com/@rive-app/webgl2@2.43.1"></script>
    <script src="personas.js?v=2"></script>
    <script src="main.js?v=3"></script>
  </body>
</html>
