<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Titan AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f1eeff;
        --ink: #1e2160;
        --line: rgba(30, 33, 96, 0.12);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 500 15px/1.4 "DM Sans", system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 16px 16px 72px;
      }
      .stage {
        width: min(100%, 78vh, 720px);
        aspect-ratio: 1;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 30px 70px -36px rgba(35, 71, 216, 0.55), 0 0 0 1px var(--line);
      }
      canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
      button {
        appearance: none;
        border: 0;
        padding: 10px 20px;
        border-radius: 999px;
        font: inherit;
        color: #fff;
        background: linear-gradient(120deg, #2f6bf2, #2a2fb0);
        box-shadow: 0 10px 24px -12px rgba(35, 71, 216, 0.9);
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      button.quiet { color: var(--ink); background: #fff; box-shadow: 0 0 0 1px var(--line); }
      button:hover { transform: translateY(-1px); }
      button:active { transform: scale(0.97); }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="The Titan AI logo">
        <canvas id="logo" width="720" height="720"></canvas>
      </section>
      <div class="controls">
        <button type="button" id="replay">Play the reveal</button>
        <button type="button" id="processing" class="quiet">Processing</button>
        <button type="button" id="idle" class="quiet">Idle</button>
      </div>
    </main>
    <script src="https://unpkg.com/@rive-app/webgl2@2.44.2"></script>
    <script src="main.js"></script>
    <script src="../../site-nav.js"></script>
  </body>
</html>
