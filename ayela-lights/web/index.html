<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aleya Lights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="scene" width="1280" height="720" aria-label="A boat drifting at night down a river through the mangroves"></canvas>
      <header class="title">
        <p class="title__eyebrow">The Sundarbans · Scene 1</p>
        <h1 class="title__name">Aleya Lights</h1>
      </header>
      <p class="status" id="status" role="status">Loading…</p>
    </main>

    <section class="controls" aria-label="Scene controls">
      <label>Boat speed <output id="speed-out">1.2</output>
        <input type="range" id="speed" min="0" max="4" step="0.1" value="1.2" />
      </label>
      <label>Fog <output id="fog-out">0.5</output>
        <input type="range" id="fog" min="0" max="1" step="0.05" value="0.5" />
      </label>
      <label>Mist <output id="mist-out">1</output>
        <input type="range" id="mist" min="0" max="1" step="0.05" value="1" />
      </label>
    </section>

    <script src="https://unpkg.com/@rive-app/webgl2@2.44.0"></script>
    <script src="main.js"></script>
  </body>
</html>
