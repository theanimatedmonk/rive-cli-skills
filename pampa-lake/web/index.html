<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pampa Sarovar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="scene" width="1280" height="720"></canvas>
      <p class="status" id="status">Drawing the lake…</p>
    </main>

    <!-- The camera, light, wind, water, mist and pollen: each slider sets the
         Scene view model, which is bound to the Lake node's inputs. -->
    <aside class="panel" id="panel">
      <header class="brand">
        <p class="brand__eyebrow">A lotus lake, in watercolour</p>
        <h1 class="brand__name">Pampa Sarovar</h1>
      </header>
      <button type="button" class="panel__toggle" id="toggle" aria-expanded="true" aria-controls="controls">Hide controls</button>
      <div class="controls" id="controls">
        <section>
          <h2>View</h2>
          <p class="hint">Drag or two-finger swipe to orbit · Shift to pan · pinch, scroll or Ctrl+drag to zoom · double-click to reset</p>
          <button type="button" class="reset" id="reset-view">Back to the hero view</button>
        </section>
        <section>
          <h2>Camera position</h2>
          <div data-slider="cameraX" data-label="X" data-min="-40" data-max="80" data-step="0.1"></div>
          <div data-slider="cameraY" data-label="Y (height)" data-min="0.4" data-max="40" data-step="0.1"></div>
          <div data-slider="cameraZ" data-label="Z" data-min="-120" data-max="30" data-step="0.1"></div>
        </section>
        <section>
          <h2>Camera axes</h2>
          <div data-slider="rotationX" data-label="Tilt (X)" data-min="-60" data-max="60" data-step="0.1"></div>
          <div data-slider="rotationY" data-label="Turn (Y)" data-min="-180" data-max="180" data-step="0.1"></div>
          <div data-slider="rotationZ" data-label="Roll (Z)" data-min="-30" data-max="30" data-step="0.5"></div>
          <div data-slider="fov" data-label="Field of view" data-min="15" data-max="90" data-step="0.1"></div>
          <div data-slider="drift" data-label="Handheld drift" data-min="0" data-max="2" data-step="0.05"></div>
        </section>
        <section>
          <h2>Watercolour</h2>
          <div data-slider="paint" data-label="Paint" data-min="0" data-max="1" data-step="0.01"></div>
          <div data-slider="brush" data-label="Brush size" data-min="1" data-max="12" data-step="0.5"></div>
          <div data-slider="edges" data-label="Edge pooling" data-min="0" data-max="3" data-step="0.05"></div>
          <div data-slider="paper" data-label="Paper grain" data-min="0" data-max="2" data-step="0.05"></div>
        </section>
        <section>
          <h2>Lens</h2>
          <div data-slider="focusDistance" data-label="Focus distance" data-min="2" data-max="200" data-step="1"></div>
          <div data-slider="depthOfField" data-label="Depth of field" data-min="0" data-max="1" data-step="0.01"></div>
          <div data-slider="exposure" data-label="Exposure" data-min="0.4" data-max="1.8" data-step="0.01"></div>
        </section>
        <section>
          <h2>Sun</h2>
          <div data-slider="sunAzimuth" data-label="Direction" data-min="-180" data-max="180" data-step="1"></div>
          <div data-slider="sunElevation" data-label="Height" data-min="2" data-max="85" data-step="0.5"></div>
          <div data-slider="sunIntensity" data-label="Strength" data-min="0" data-max="2.5" data-step="0.05"></div>
          <div data-slider="shading" data-label="Shade depth" data-min="0" data-max="1" data-step="0.01"></div>
        </section>
        <section>
          <h2>Meadow</h2>
          <div data-slider="greens" data-label="Greens" data-min="0" data-max="1" data-step="0.01"></div>
          <div data-slider="plants" data-label="Flowers and bushes" data-min="0" data-max="1" data-step="0.01"></div>
        </section>
        <section>
          <h2>Wind</h2>
          <div data-slider="windStrength" data-label="Strength" data-min="0" data-max="2.5" data-step="0.05"></div>
          <div data-slider="windSpeed" data-label="Speed" data-min="0" data-max="3" data-step="0.05"></div>
          <div data-slider="windDirection" data-label="Direction" data-min="-180" data-max="360" data-step="1"></div>
        </section>
        <section>
          <h2>Water</h2>
          <div data-slider="reflection" data-label="Reflection" data-min="0" data-max="1" data-step="0.01"></div>
          <div data-slider="ripples" data-label="Ripples" data-min="0" data-max="3" data-step="0.05"></div>
        </section>
        <section>
          <h2>Air</h2>
          <div data-slider="haze" data-label="Haze" data-min="0" data-max="2" data-step="0.01"></div>
          <div data-slider="clouds" data-label="Clouds" data-min="0" data-max="1" data-step="0.01"></div>
          <div data-slider="mist" data-label="Mist" data-min="0" data-max="3" data-step="0.05"></div>
          <div data-slider="wisps" data-label="Mist banks" data-min="0" data-max="64" data-step="1"></div>
          <div data-slider="wispOpacity" data-label="Bank opacity" data-min="0" data-max="1" data-step="0.01"></div>
          <div data-slider="pollenAmount" data-label="Pollen" data-min="0" data-max="3000" data-step="10"></div>
        </section>
        <div class="actions">
          <button type="button" class="reset" id="copy">Copy settings</button>
          <button type="button" class="reset" id="reset">Reset everything</button>
        </div>
        <textarea class="settings" id="settings" rows="6" readonly hidden></textarea>
      </div>
    </aside>

    <script src="https://unpkg.com/@rive-app/webgl2@2.44.2"></script>
    <script src="main.js"></script>
    <script src="../../site-nav.js"></script>
  </body>
</html>
